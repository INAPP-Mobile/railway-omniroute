<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4"/><stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" rx="120" fill="url(#bg)"/>
  <!-- Route/proxy icon: arrows converging -->
  <g transform="translate(400,400)">
    <!-- Central hub -->
    <circle cx="0" cy="0" r="60" fill="#FFFFFF"/>
    <!-- Incoming arrows (from left) -->
    <path d="M -240 -80 L -120 -80 L -140 -100 L -100 -80 L -140 -60 L -120 -80" stroke="#FFFFFF" stroke-width="24" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -240 80 L -120 80 L -140 100 L -100 80 L -140 60 L -120 80" stroke="#FFFFFF" stroke-width="24" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Outgoing arrow (to right) -->
    <path d="M 60 0 L 240 0 L 220 -20 L 260 0 L 220 20" stroke="#FFFFFF" stroke-width="24" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
